# M1-18 replica-removal runs (AC-M1-4): gateway-affinity reads its config from
# a host directory that balance.py rewrites mid-run, instead of the committed
# ./config (which stays untouched). The gateway re-reads the file every
# discovery.reload_interval (default 2s) and applies replica-list changes.
#
#   ROUTERS_LIVE_CONFIG=/abs/dir/holding/gateway.affinity.yaml \
#   docker compose -f deploy/compose/routers/docker-compose.yml \
#     -f deploy/compose/routers/docker-compose.live-config.yml \
#     up -d --wait gateway-affinity
#
# A directory (not a single file) is mounted so an atomic rename of the file
# on the host is visible inside the container.
services:
  gateway-affinity:
    volumes:
      - ${ROUTERS_LIVE_CONFIG:?set ROUTERS_LIVE_CONFIG to a directory holding gateway.affinity.yaml}:/etc/gateway-live:ro
    environment:
      GATEWAY_CONFIG: /etc/gateway-live/gateway.affinity.yaml
