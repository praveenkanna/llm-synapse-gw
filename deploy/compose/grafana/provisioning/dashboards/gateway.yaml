apiVersion: 1

# Dashboards are JSON files in deploy/compose/grafana/dashboards/ (M0-12),
# mounted read-only; edit the files, not the UI.
providers:
  - name: llm-synapse-gw
    folder: LLM Synapse Gateway
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
