# nginx in front of the gateway containers. SSE must survive this hop:
# no response buffering or caching, long read timeouts, HTTP/1.1 keep-alive
# to the gateways. Streams hold two connections each (client + upstream).

worker_processes auto;
worker_rlimit_nofile 65536;   # matches ulimits.nofile in docker-compose.yml

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    # The container's own DNS (Docker's embedded resolver, or Podman's
    # aardvark-dns), filled in by the image entrypoint; see docker-compose.yml.
    # Re-resolve gateway names so a restarted container (new IP) is picked up
    # without reloading nginx. Rendered as a template: only defined env vars
    # are substituted, so nginx's own $variables are left alone.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    resolver_timeout 2s;

    # Request line, status and timings only: no bodies, no Authorization.
    log_format gateway escape=json '{"time":"$time_iso8601","remote":"$remote_addr",'
        '"method":"$request_method","uri":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"request_time":$request_time,'
        '"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
        '"upstream_connect_time":"$upstream_connect_time",'
        '"upstream_header_time":"$upstream_header_time",'
        '"traceparent":"$http_traceparent"}';
    access_log /dev/stdout gateway buffer=64k flush=1s;
    error_log /dev/stderr warn;

    server_tokens off;
    sendfile off;
    tcp_nodelay on;
    gzip off;               # compressing SSE would buffer it
    keepalive_timeout 75s;  # client side
    keepalive_requests 100000;

    # Coalescing flights live in one gateway (ADR 0020): identical requests
    # share their template, so a template's requests go to one gateway.
    # Untemplated requests spread on the per-request ID.
    map $http_x_template_id $gateway_key {
        ""      $request_id;
        default $http_x_template_id;
    }

    upstream gateway {
        zone gateway 64k;   # required by `resolve`
        hash $gateway_key consistent;
        # Connect failures mark a gateway down briefly; the other takes over.
        server gateway-1:8080 resolve max_fails=1 fail_timeout=5s;
        server gateway-2:8080 resolve max_fails=1 fail_timeout=5s;
        keepalive 512;
        keepalive_requests 100000;
        # Below the gateway's server.idle_timeout (120s), so nginx never
        # reuses a connection the gateway is about to close.
        keepalive_timeout 60s;
    }

    server {
        listen 80 reuseport backlog=4096;

        # Matches the gateway's default request body limit (32 MiB).
        client_max_body_size 32m;
        client_body_buffer_size 1m;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Relay the response as it arrives. X-Accel-Buffering from the
            # gateway is honoured (proxy_ignore_headers is not set).
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;

            # Long generations: no read/send cutoff below an hour.
            proxy_connect_timeout 2s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Retry on the other gateway only if the connection failed before
            # anything was sent. POST is never re-sent once it reached a
            # gateway (no `non_idempotent`), so generations are not retried.
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;

            # Client went away: close the upstream connection so the gateway
            # cancels the replica request (default, stated for clarity).
            proxy_ignore_client_abort off;
        }
    }
}
