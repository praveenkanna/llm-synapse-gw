# Small classification and extraction calls (brief section 2, shape 3): short
# prompts, short outputs, high frequency, served by the small tier. In the
# mixed profile they fire around each chat turn; here they arrive on their own.
#
# Lengths are in synthetic words (prompts) and tokens (max_tokens). All text
# is generated: no real prompts. Schema: harness/profiles/README.md.
name: classify
description: Short, high-frequency classification calls on the small model.
model: small-model
arrival:
  rate: 40
classes:
  - name: classify
    weight: 1
    stream: false
    system_words: {dist: uniform, min: 60, max: 200}
    shared_prefixes: 6          # one per classifier
    shared_prefix_ratio: 1.0
    prompt_words: {dist: lognormal, median: 30, sigma: 0.6, min: 5, max: 200}
    max_tokens: {dist: uniform, min: 2, max: 16}
